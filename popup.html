<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rikyspace AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { width: 320px; padding: 16px; background-color: #f8fafc; color: #0f172a; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .header h1 { font-size: 16px; color: #2563eb; font-weight: 700; }
    .config-group { margin-bottom: 12px; }
    label { font-size: 11px; font-weight: 600; color: #64748b; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; }
    input:focus, select:focus { border-color: #2563eb; }
    button { width: 100%; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    .result-box { margin-top: 12px; padding: 10px; background: white; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 12px; max-height: 180px; overflow-y: auto; line-height: 1.5; white-space: pre-wrap; }
    .status { font-size: 11px; color: #64748b; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>✨ Rikyspace AI</h1>
  </div>

  <div class="config-group">
    <label for="apiKey">Gemini API Key 🔑</label>
    <input type="password" id="apiKey" placeholder="Tempel API Key di sini...">
  </div>

  <div class="config-group">
    <label for="length">Panjang Rangkuman 📝</label>
    <select id="length">
      <option value="singkat">Singkat & Padat (3 Poin)</option>
      <option value="sedang" selected>Standar (1 Paragraf)</option>
      <option value="detail">Mendalam & Detail</option>
    </select>
  </div>

  <button id="summarizeBtn">⚡ Rangkum Halaman Ini</button>
  
  <div id="status" class="status"></div>
  <div id="result" class="result-box" style="display: none;"></div>

  <script src="popup.js"></script>
</body>
</html>
